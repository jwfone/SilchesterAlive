<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key review: __ID__</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --ink: #24211c; --muted: #6d675d; --line: #d8d2c6;
    --grid: #e6e1d6; --road: #d9d4c8; --plot: #2f6fd0; --kit: #c8402e;
    --s1: #4a4038; --s2: #7a6a55; --s3: #a8957a; --s4: #c4b59c; --s5: #ddd2bd;
    --in: #1f8a4c; --maybe: #d08a12; --out: #9a9a9a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17161a; --panel: #211f25; --ink: #ece8e1; --muted: #a39d93; --line: #3a363d;
      --grid: #2a272e; --road: #34313a; --plot: #6aa3ff; --kit: #ff7a63;
      --s1: #e9dfcf; --s2: #c9b89c; --s3: #a08f75; --s4: #7c6f5c; --s5: #5c5346;
      --in: #4cd28a; --maybe: #f2b33d; --out: #6c6c6c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
  .wrap { display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; height: auto; } #map { height: 70vh; } }
  #map { width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #map.drag { cursor: grabbing; }
  aside { background: var(--panel); border-left: 1px solid var(--line); padding: 16px; overflow: auto; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 12px; padding: 8px 10px; }
  legend { font-size: 12px; color: var(--muted); padding: 0 4px; }
  label { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 2px 0; }
  .sw { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
  .counts span { display: inline-block; margin-right: 10px; font-variant-numeric: tabular-nums; }
  textarea { width: 100%; height: 160px; font: 12px/1.4 ui-monospace, monospace; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
  button { font: inherit; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
  #tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; display: none; box-shadow: 0 2px 8px rgba(0,0,0,.15); max-width: 280px; }
  #note { width: 100%; font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  .sel { color: var(--muted); font-size: 12px; min-height: 2.6em; }
  svg text { font-family: system-ui, sans-serif; fill: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
  <aside>
    <h1>__ID__: Great Plan review</h1>
    <p class="sub">Click a wall ring to cycle: unassigned → part of building → uncertain → not part. Drag to pan, scroll to zoom. Coordinates are OSGB (EPSG:27700).</p>
    <fieldset><legend>Layers</legend>
      <label><input type="checkbox" data-l="roads" checked> Streets</label>
      <label><input type="checkbox" data-l="plot" checked><span class="sw" style="border:2px dashed var(--plot)"></span> Pinned footprint</label>
      <label><input type="checkbox" data-l="kit" checked><span class="sw" style="border:2px solid var(--kit)"></span> Current 3D model</label>
      <label><input type="checkbox" data-l="labels" checked> Ring ids</label>
      <div id="shades"></div>
      <div id="underctl"></div>
    </fieldset>
    <fieldset><legend>Classification</legend>
      <div class="counts" id="counts"></div>
      <div class="sel" id="sel">No ring selected.</div>
      <input id="note" placeholder="Note for selected ring (e.g. 'later phase', 'hypocaust')" disabled>
    </fieldset>
    <fieldset><legend>Result — copy and paste back</legend>
      <textarea id="out" readonly></textarea>
      <button id="copy">Copy</button>
    </fieldset>
  </aside>
</div>
<div id="tip"></div>
<script>
const D = /*DATA*/null;
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('map');
const STATES = ['unassigned', 'in', 'maybe', 'out'];
const state = {};
for (const r of D.rings) state[r.ref] = { cls: D.review.rings[r.ref]?.cls ?? 'unassigned', note: D.review.rings[r.ref]?.note ?? '' };

// OSGB northing grows up; SVG y grows down, so y = -N.
const pathOf = (rings) => rings.map((r) => 'M' + r.map(([e, n]) => `${e.toFixed(2)},${(-n).toFixed(2)}`).join('L') + 'Z').join('');
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

const g = { grid: el('g', {}, svg), roads: el('g', {}, svg), under: el('g', {}, svg), rings: el('g', {}, svg), plot: el('g', {}, svg), kit: el('g', {}, svg), labels: el('g', {}, svg) };
const W = D.win;
const step = 10;
for (let e = Math.ceil(W.e0 / step) * step; e <= W.e1; e += step) {
  el('line', { x1: e, x2: e, y1: -W.n1, y2: -W.n0, stroke: 'var(--grid)', 'stroke-width': e % 50 === 0 ? 0.35 : 0.15 }, g.grid);
  if (e % 50 === 0) el('text', { x: e + 0.6, y: -W.n0 - 1, 'font-size': 2.4 }, g.grid).textContent = 'E ' + e;
}
for (let n = Math.ceil(W.n0 / step) * step; n <= W.n1; n += step) {
  el('line', { x1: W.e0, x2: W.e1, y1: -n, y2: -n, stroke: 'var(--grid)', 'stroke-width': n % 50 === 0 ? 0.35 : 0.15 }, g.grid);
  if (n % 50 === 0) el('text', { x: W.e0 + 0.6, y: -n - 0.6, 'font-size': 2.4 }, g.grid).textContent = 'N ' + n;
}
for (const u of D.underlays) {
  const im = el('image', { href: u.href, width: u.w, height: u.h, transform: `matrix(${u.m.join(' ')})`, opacity: u.opacity, preserveAspectRatio: 'none' }, g.under);
  im.style.pointerEvents = 'none';
}
if (D.underlays.length) {
  document.getElementById('underctl').innerHTML =
    `<label><input type="checkbox" data-l="under" checked> ${D.underlays.map((u) => u.label).join(', ')}</label>` +
    `<label>Opacity <input type="range" id="uop" min="0" max="1" step="0.05" value="${D.underlays[0].opacity}"></label>` +
    `<label><input type="checkbox" id="ringsoff"> Hide GIS rings</label>`;
  document.getElementById('uop').addEventListener('input', (e) => g.under.querySelectorAll('image').forEach((i) => i.setAttribute('opacity', e.target.value)));
  document.getElementById('ringsoff').addEventListener('change', (e) => { g.rings.style.opacity = e.target.checked ? 0 : 1; });
}
for (const r of D.roads) el('path', { d: pathOf(r), fill: 'var(--road)', 'fill-rule': 'evenodd', stroke: 'none' }, g.roads);
el('path', { d: pathOf([D.plot]), fill: 'none', stroke: 'var(--plot)', 'stroke-width': 0.45, 'stroke-dasharray': '1.6 1' }, g.plot);
for (const k of D.kit) {
  el('path', { d: pathOf([k.ring]), fill: 'none', stroke: 'var(--kit)', 'stroke-width': 0.35 }, g.kit);
  const cx = k.ring.slice(0, 4).reduce((s, p) => s + p[0], 0) / 4, cy = k.ring.slice(0, 4).reduce((s, p) => s + p[1], 0) / 4;
  const t = el('text', { x: cx, y: -cy, 'font-size': 1.8, 'text-anchor': 'middle', style: 'fill:var(--kit)' }, g.kit); t.textContent = k.label;
}

const shades = [...new Set(D.rings.map((r) => r.shade))].sort();
const shadeOn = Object.fromEntries(shades.map((s) => [s, true]));
document.getElementById('shades').innerHTML = shades.map((s) =>
  `<label><input type="checkbox" data-shade="${s}" checked><span class="sw" style="background:var(--s${s})"></span> Great Plan shade ${s} (${D.rings.filter((r) => r.shade === s).length})</label>`).join('');

const clsStroke = { unassigned: 'none', in: 'var(--in)', maybe: 'var(--maybe)', out: 'var(--out)' };
const paths = {};
let selected = null;
// Big rings first so small fragments stay clickable on top.
for (const r of [...D.rings].sort((a, b) => b.area - a.area)) {
  const p = el('path', { d: pathOf(r.rings), 'fill-rule': 'evenodd', fill: `var(--s${r.shade})`, 'data-ref': r.ref, style: 'cursor:pointer' }, g.rings);
  paths[r.ref] = p;
  const lab = el('text', { x: r.centre[0], y: -r.centre[1], 'font-size': 1.3, 'text-anchor': 'middle', 'pointer-events': 'none' }, g.labels);
  lab.textContent = r.ref.slice(1);
}
const byRef = Object.fromEntries(D.rings.map((r) => [r.ref, r]));
function paint() {
  for (const r of D.rings) {
    const p = paths[r.ref], s = state[r.ref];
    p.style.display = shadeOn[r.shade] ? '' : 'none';
    p.setAttribute('stroke', r.ref === selected ? 'var(--plot)' : clsStroke[s.cls]);
    p.setAttribute('stroke-width', r.ref === selected ? 0.5 : 0.3);
    p.setAttribute('opacity', s.cls === 'out' ? 0.35 : 1);
  }
  const c = { unassigned: 0, in: 0, maybe: 0, out: 0 };
  for (const k in state) c[state[k].cls]++;
  document.getElementById('counts').innerHTML =
    `<span style="color:var(--in)">part: ${c.in}</span><span style="color:var(--maybe)">uncertain: ${c.maybe}</span><span style="color:var(--out)">not: ${c.out}</span><span>unassigned: ${c.unassigned}</span>`;
  const out = {};
  for (const k of Object.keys(state).sort((a, b) => a.slice(1) - b.slice(1))) if (state[k].cls !== 'unassigned' || state[k].note) out[k] = state[k];
  document.getElementById('out').value = JSON.stringify({ id: D.id, rings: out }, null, 1);
  const sel = document.getElementById('sel'), note = document.getElementById('note');
  if (selected) {
    const r = byRef[selected], s = state[selected];
    sel.textContent = `Ring ${selected.slice(1)} · shade ${r.shade} · ${r.area} m² · ${s.cls}` + (D.review.rings[selected]?.why ? ` — my reading: ${D.review.rings[selected].why}` : '');
    note.disabled = false; note.value = s.note;
  } else { sel.textContent = 'No ring selected.'; note.disabled = true; note.value = ''; }
}
document.getElementById('note').addEventListener('input', (e) => { if (selected) { state[selected].note = e.target.value; paint(); } });

const tip = document.getElementById('tip');
let downAt = null;
g.rings.addEventListener('mousemove', (e) => {
  const ref = e.target.getAttribute('data-ref'); if (!ref) return;
  const r = byRef[ref], s = state[ref];
  tip.style.display = 'block'; tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 10 + 'px';
  tip.innerHTML = `<b>Ring ${ref.slice(1)}</b> · shade ${r.shade} · ${r.area} m²<br>OSGB ${r.centre[0]}, ${r.centre[1]}<br>lat/lon ${r.latlon[0]}, ${r.latlon[1]}<br>${s.cls}${D.review.rings[ref]?.why ? '<br><i>' + D.review.rings[ref].why + '</i>' : ''}${s.note ? '<br>note: ' + s.note : ''}`;
});
g.rings.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
g.rings.addEventListener('click', (e) => {
  const ref = e.target.getAttribute('data-ref'); if (!ref || moved) return;
  if (selected === ref) state[ref].cls = STATES[(STATES.indexOf(state[ref].cls) + 1) % STATES.length];
  selected = ref; paint();
});

document.querySelectorAll('input[data-l]').forEach((b) => b.addEventListener('change', () => { g[b.dataset.l].style.display = b.checked ? '' : 'none'; }));
document.querySelectorAll('input[data-shade]').forEach((b) => b.addEventListener('change', () => { shadeOn[b.dataset.shade] = b.checked; paint(); }));
document.getElementById('copy').addEventListener('click', () => { const t = document.getElementById('out'); t.select(); try { navigator.clipboard.writeText(t.value); } catch { document.execCommand('copy'); } });

// Pan/zoom via viewBox.
let vb = { x: W.e0, y: -W.n1, w: W.e1 - W.e0, h: W.n1 - W.n0 };
const setVB = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
setVB();
const toSvg = (cx, cy) => { const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  const p = toSvg(e.clientX, e.clientY), f = e.deltaY > 0 ? 1.15 : 1 / 1.15;
  vb = { x: p.x - (p.x - vb.x) * f, y: p.y - (p.y - vb.y) * f, w: vb.w * f, h: vb.h * f }; setVB();
}, { passive: false });
let moved = false;
svg.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY, vb: { ...vb } }; moved = false; });
window.addEventListener('pointermove', (e) => {
  if (!downAt) return;
  const dx = e.clientX - downAt.x, dy = e.clientY - downAt.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; svg.classList.add('drag'); }
  if (!moved) return;
  const s = vb.w / svg.clientWidth * (svg.clientWidth / svg.getBoundingClientRect().width);
  const k = Math.max(vb.w / svg.clientWidth, vb.h / svg.clientHeight);
  vb.x = downAt.vb.x - dx * k; vb.y = downAt.vb.y - dy * k; setVB(); void s;
});
window.addEventListener('pointerup', () => { downAt = null; svg.classList.remove('drag'); setTimeout(() => { moved = false; }, 0); });
paint();
</script>
</body>
</html>
