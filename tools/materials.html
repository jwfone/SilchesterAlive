<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall materials lab</title>
<style>
  :root { --bg: #f7f5ef; --ink: #23201b; --muted: #6b655b; --line: #d9d3c7; --panel: #fff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; display: flex; flex-direction: column; }
  header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0; }
  .ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .ctl button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; cursor: pointer; }
  .ctl button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  p.note { margin: 0; color: var(--muted); font-size: 13px; flex-basis: 100%; }
  #stage { position: relative; flex: 1; min-height: 420px; }
  #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .label { position: absolute; padding: 4px 8px; background: rgba(255,255,255,.88); border-radius: 6px; font-size: 13px; pointer-events: none; }
  .label b { display: block; }
  .label span { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Wall materials lab: baths</h1>
  <div class="ctl" role="group" aria-label="Camera">
    View <button data-cam="detail" aria-pressed="false">Detail</button><button data-cam="close" aria-pressed="true">Wall close-up</button><button data-cam="corner" aria-pressed="false">Corner</button><button data-cam="long" aria-pressed="false">Long wall</button><button data-cam="street" aria-pressed="false">Street front</button><button data-cam="aerial" aria-pressed="false">Aerial</button><button data-cam="aerialN" aria-pressed="false">Aerial (north)</button>
  </div>
  <p class="note">Same model and camera in every pane; drag to orbit, scroll to zoom. All use the same single material and draw call; only the style switch differs.</p>
</header>
<div id="stage"></div>
<script type="module" src="/src/tools/materials.ts"></script>
</body>
</html>
