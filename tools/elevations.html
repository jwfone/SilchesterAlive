<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key building drawings</title>
<style>
  :root { --bg: #f7f5ef; --ink: #23201b; --muted: #6b655b; --line: #d9d3c7; --panel: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
  header { padding: 14px 18px 8px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0; }
  .ctl { display: flex; gap: 6px; align-items: center; }
  .ctl button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; cursor: pointer; }
  .ctl button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; margin-right: 12px; }
  .legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  #tris { color: var(--muted); font-variant-numeric: tabular-nums; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px 18px 24px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  figure.wide { grid-column: 1 / -1; }
  .view { position: relative; width: 100%; aspect-ratio: 16 / 7; }
  .view.tall { aspect-ratio: 16 / 9; }
  .view canvas { display: block; width: 100%; height: 100%; }
  .ruler { position: absolute; left: 0; top: 0; bottom: 0; width: 38px; pointer-events: none; font-size: 11px; color: var(--muted); }
  .ruler div { position: absolute; left: 4px; transform: translateY(-50%); }
  figcaption { padding: 8px 12px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  figcaption b { color: var(--ink); }
  #about { max-width: 72ch; margin: 0 auto; padding: 8px 18px 48px; }
  #about h2 { font-size: 22px; margin: 18px 0 8px; }
  #about h3 { font-size: 16px; margin: 20px 0 6px; }
  #about p, #about li { color: #3a352d; }
  #about a { color: #7a3b1f; }
  .about-link { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Baths: elevation drawings</h1>
  <div class="ctl" role="group" aria-label="Colouring">
    <button id="mode-ev" aria-pressed="true">Evidence</button>
    <button id="mode-mat" aria-pressed="false">Materials</button>
    <button id="mode-plain" aria-pressed="false">Plain</button>
  </div>
  <div class="ctl" role="group" aria-label="Level of detail">
    LOD <button data-lod="0" aria-pressed="true">0</button><button data-lod="1" aria-pressed="false">1</button><button data-lod="2" aria-pressed="false">2</button>
  </div>
  <div class="legend" id="legend">
    <span><i style="background:#54a85c"></i>Silchester evidence</span>
    <span><i style="background:#eba333"></i>Comparison</span>
    <span><i style="background:#d9544d"></i>Conjecture</span>
    <span><i style="background:#ccc7bd"></i>Floors / tops</span>
  </div>
  <div id="tris"></div>
  <a class="about-link" href="#about">How this reconstruction was made ↓</a>
</header>
<main id="views"></main>
<article id="about"></article>
<script type="module" src="/src/tools/elevations.ts"></script>
</body>
</html>
