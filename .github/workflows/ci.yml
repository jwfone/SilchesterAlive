name: ci

on:
  push:
  pull_request:

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable commit SHAs (trailing comments record the tag for
      # humans + Dependabot). Re-pin with: gh api repos/{owner}/{repo}/commits/{tag} --jq .sha
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      # Secret scan: fails on committed keys/tokens (e.g. .env contents).
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check
      # Full audit (incl. dev): build-time deps (vite, tsc) run during `npm run build`.
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run smoke
